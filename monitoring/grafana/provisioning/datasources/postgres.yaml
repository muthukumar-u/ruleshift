apiVersion: 1
datasources:
  - name: RuleShift PostgreSQL
    uid: ruleshift-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: ruleshift_reader
    isDefault: true
    editable: false
    jsonData:
      database: ruleshift
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: $READER_PASSWORD
