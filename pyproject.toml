[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleshift"
version = "0.1.0"
description = "Paired, oracle-verified robustness evaluations for language models"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
ruleshift = "ruleshift.cli:main"

[tool.setuptools.packages.find]
include = ["ruleshift*"]
